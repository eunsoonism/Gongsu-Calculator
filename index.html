<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>공수 계산기</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calendar-nav button {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .calendar-nav h2 {
            font-size: 18px;
            font-weight: 700;
        }

        /* 캘린더 그리드 */
        .calendar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow-y: auto;
            padding: 8px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-sub);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .weekdays div:first-child { color: #ef4444; } /* 일요일 */
        .weekdays div:last-child { color: #3b82f6; }  /* 토요일 */

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(70px, 1fr);
            gap: 2px;
            background: var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .day-cell {
            background: #ffffff;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            cursor: pointer;
            position: relative;
            min-height: 75px;
        }

        .day-cell.other-month {
            color: #cbd5e1;
            background: #fafafa;
        }

        .day-number {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 2px;
            width: 100%;
            text-align: center;
        }

        .day-cell:nth-child(7n+1) .day-number { color: #ef4444; }
        .day-cell:nth-child(7n) .day-number { color: #3b82f6; }
        .day-cell.other-month:nth-child(7n+1) .day-number,
        .day-cell.other-month:nth-child(7n) .day-number { color: #e2e8f0; }

        .day-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1px;
            align-items: center;
        }

        /* 공수/금액 뱃지 스타일 (잘림 방지 위해 패딩 및 폰트 미세 조정) */
        .badge-gongsu {
            background-color: #d1fae5;
            color: #065f46;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 3px;
            border-radius: 4px;
            text-align: center;
            width: 100%;
        }

        .badge-amount {
            background-color: var(--accent-green);
            color: #ffffff;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 2px;
            border-radius: 4px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            letter-spacing: -0.5px; /* 긴 금액 압축 표시 */
        }

        .day-cell.selected {
            border: 2px solid var(--primary-color);
            z-index: 2;
        }

        /* 하단 요약 및 컨트롤 패널 */
        .control-panel {
            background: #ffffff;
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .current-site-info {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .action-buttons button {
            padding: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #ffffff;
        }

        .btn-gongsu { background-color: var(--primary-color); }
        .btn-danga { background-color: #ef4444; }
        .btn-memo { background-color: #475569; }
        .btn-site { background-color: var(--accent-green); }

        .summary-bar {
            background: #1e293b;
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .summary-bar span:last-child {
            color: #34d399;
            font-size: 16px;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content h3 { font-size: 16px; margin-bottom: 4px; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel { background: #e2e8f0; color: var(--text-main); }
        .btn-save { background: var(--primary-color); color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <div class="calendar-nav">
            <button onclick="changeMonth(-1)">&lt; 이전</button>
            <h2 id="monthTitle">2026년 7월</h2>
            <button onclick="changeMonth(1)">다음 &gt;</button>
        </div>
        <button onclick="goToday()" style="background:#f1f5f9; border:1px solid var(--border-color); padding:6px 10px; border-radius:6px; font-size:13px; cursor:pointer;">오늘</button>
    </header>

    <div class="calendar-container">
        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="days-grid" id="daysGrid">
            <!-- 달력 날짜 동적 생성 -->
        </div>
    </div>

    <div class="control-panel">
        <div class="current-site-info" id="currentSiteDisplay">현장 : (입력된 현장 없음)</div>
        <div class="action-buttons">
            <button class="btn-gongsu" onclick="openGongsuModal()">공수</button>
            <button class="btn-danga" onclick="openDangaModal()">단가</button>
            <button class="btn-memo" onclick="openMemoModal()">메모</button>
            <button class="btn-site" onclick="openSiteModal()">현장</button>
        </div>
    </div>

    <div class="summary-bar">
        <span>이번 달 누적 공수 <strong id="totalGongsu">0.0</strong> 공수</span>
        <span>예상 총 급여 <strong id="totalSalary">0 원</strong></span>
    </div>

    <!-- 공수 입력 모달 -->
    <div class="modal" id="gongsuModal">
        <div class="modal-content">
            <h3>공수 입력</h3>
            <input type="number" id="gongsuInput" step="0.1" placeholder="예: 1.0, 1.5">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModals()">취소</button>
                <button class="btn-save" onclick="saveGongsu()">저장</button>
            </div>
        </div>
    </div>

    <!-- 단가 입력 모달 -->
    <div class="modal" id="dangaModal">
        <div class="modal-content">
            <h3>단가 입력 (원)</h3>
            <input type="number" id="dangaInput" placeholder="예: 160000">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModals()">취소</button>
                <button class="btn-save" onclick="saveDanga()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date(2026, 6, 1); // 기본 2026년 7월
        let selectedDateStr = null;
        let workData = JSON.parse(localStorage.getItem('workData')) || {};
        let dangaData = JSON.parse(localStorage.getItem('dangaData')) || {};

        function initCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('monthTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            let totalCellsCount = 42; // 6주 고정 그리드
            let dayCount = 1;
            let nextMonthDayCount = 1;

            for (let i = 0; i < totalCellsCount; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                let cellDateStr = '';
                let dYear = year, dMonth = month, dDay = 0;

                if (i < firstDayIndex) {
                    // 이전 달 날짜
                    dDay = prevLastDay - firstDayIndex + i + 1;
                    dMonth = month - 1;
                    if (dMonth < 0) { dMonth = 11; dYear--; }
                    cell.classList.add('other-month');
                } else if (i >= firstDayIndex + lastDay) {
                    // 다음 달 날짜
                    dDay = nextMonthDayCount++;
                    dMonth = month + 1;
                    if (dMonth > 11) { dMonth = 0; dYear++; }
                    cell.classList.add('other-month');
                } else {
                    // 이번 달 날짜
                    dDay = dayCount++;
                }

                dMonth = String(dMonth + 1).padStart(2, '0');
                dDayStr = String(dDay).padStart(2, '0');
                cellDateStr = `${dYear}-${dMonth}-${dDayStr}`;

                cell.setAttribute('data-date', cellDateStr);
                cell.onclick = () => selectDate(cellDateStr);

                if (selectedDateStr === cellDateStr) {
                    cell.classList.add('selected');
                }

                // 날짜 번호 표시
                const numDiv = document.createElement('div');
                numDiv.className = 'day-number';
                numDiv.innerText = dDay;
                cell.appendChild(numDiv);

                // 데이터(공수/금액) 표시
                if (workData[cellDateStr]) {
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'day-content';

                    const gongsuVal = workData[cellDateStr].gongsu || 0;
                    if (gongsuVal > 0) {
                        const gBadge = document.createElement('div');
                        gBadge.className = 'badge-gongsu';
                        gBadge.innerText = gongsuVal;
                        contentDiv.appendChild(gBadge);

                        // 해당 월/일 단가 계산
                        const currentDanga = getDangaForDate(cellDateStr);
                        const calculatedAmount = gongsuVal * currentDanga;

                        const aBadge = document.createElement('div');
                        aBadge.className = 'badge-amount';
                        // 금액이 길어도 잘리지 않도록 만 단위나 축약, 혹은 숫자 포맷 적용
                        aBadge.innerText = calculatedAmount.toLocaleString() + '원';
                        contentDiv.appendChild(aBadge);
                    }
                    cell.appendChild(contentDiv);
                }

                grid.appendChild(cell);
            }

            updateSummary();
        }

        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            initCalendar();
        }

        function goToday() {
            currentDate = new Date();
            initCalendar();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            initCalendar();
        }

        function getDangaForDate(dateStr) {
            // 가장 가까운 과거 또는 당일 설정된 단가 가져오기 (없으면 기본 150,000원)
            if (dangaData[dateStr]) return dangaData[dateStr];
            
            const sortedDates = Object.keys(dangaData).sort();
            let activeDanga = 150000;
            for (let d of sortedDates) {
                if (d <= dateStr) {
                    activeDanga = dangaData[d];
                } else {
                    break;
                }
            }
            return activeDanga;
        }

        function openGongsuModal() {
            if (!selectedDateStr) {
                alert('날짜를 먼저 선택해주세요.');
                return;
            }
            document.getElementById('gongsuInput').value = workData[selectedDateStr]?.gongsu || '';
            document.getElementById('gongsuModal').classList.add('active');
        }

        function openDangaModal() {
            if (!selectedDateStr) {
                alert('단가를 적용할 기준 날짜를 먼저 선택해주세요.');
                return;
            }
            document.getElementById('dangaInput').value = dangaData[selectedDateStr] || getDangaForDate(selectedDateStr);
            document.getElementById('dangaModal').classList.add('active');
        }

        function openMemoModal() { alert('메모 기능 준비 중입니다.'); }
        function openSiteModal() { alert('현장 관리 기능 준비 중입니다.'); }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }

        function saveGongsu() {
            const val = parseFloat(document.getElementById('gongsuInput').value);
            if (isNaN(val) || val < 0) {
                alert('올바른 공수 값을 입력해주세요.');
                return;
            }

            if (!workData[selectedDateStr]) workData[selectedDateStr] = {};
            workData[selectedDateStr].gongsu = val;

            localStorage.setItem('workData', JSON.stringify(workData));
            closeModals();
            initCalendar();
        }

        function saveDanga() {
            const val = parseInt(document.getElementById('dangaInput').value);
            if (isNaN(val) || val < 0) {
                alert('올바른 단가를 입력해주세요.');
                return;
            }

            dangaData[selectedDateStr] = val;
            localStorage.setItem('dangaData', JSON.stringify(dangaData));
            closeModals();
            initCalendar();
        }

        function updateSummary() {
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const prefix = `${year}-${month}`;

            let totalG = 0;
            let totalS = 0;

            for (let dateStr in workData) {
                if (dateStr.startsWith(prefix)) {
                    const g = workData[dateStr].gongsu || 0;
                    totalG += g;
                    totalS += g * getDangaForDate(dateStr);
                }
            }

            document.getElementById('totalGongsu').innerText = totalG.toFixed(1);
            document.getElementById('totalSalary').innerText = totalS.toLocaleString() + ' 원';
        }

        // 초기 실행
        initCalendar();
    </script>
</body>
</html>
