<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>공수계산기</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="공수계산기">
    <link rel="apple-touch-icon" href="gongsu-icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom); }

        /* 상단 타이틀 글씨 크기 키움 */
        .app-header { background: #0f172a; color: white; padding: 6px 16px 4px 16px; font-size: 18px; font-weight: 800; text-align: center; letter-spacing: -0.5px; flex-shrink: 0; }

        .header-card { background: #1e293b; color: white; padding: 5px 12px 10px 12px; border-top: 1px solid #334155; flex-shrink: 0; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 4px 12px; border-radius: 8px; border: 1px solid #334155; }
        .summary-item label { font-size: 10px; color: #94a3b8; display: block; }
        .summary-item val { font-size: 13px; font-weight: 700; color: #38bdf8; }
        .summary-item val.pay { color: #4ade80; }

        .calendar-wrapper { flex: 1; background: #ffffff; display: flex; flex-direction: column; border-top-left-radius: 16px; border-top-right-radius: 16px; overflow: hidden; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); min-height: 0; }
        
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 4px 16px; flex-shrink: 0; }
        .calendar-nav button { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; color: #334155; }
        
        /* 2026년 O월 글자 크기 키움 */
        #month-year { font-size: 18px; font-weight: 800; color: #0f172a; cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: background 0.2s; text-align: center; }
        #month-year:hover { background: #f1f5f9; }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; font-size: 11px; padding: 0 2px 2px 2px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
        .weekdays div:first-child { color: #ef4444; } 
        .weekdays div:last-child { color: #3b82f6; }  
        .weekdays div:not(:first-child):not(:last-child) { color: #64748b; }

        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(0, 1fr); gap: 1px; padding: 2px; flex: 1; overflow: hidden; background: #e2e8f0; min-height: 0; }
        
        .day-cell { background: #f8fafc; border: none; border-radius: 2px; padding: 0px; display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer; position: relative; overflow: hidden; }
        .day-cell.other-month { opacity: 0.25; background: #fdfdfd; }
        
        .day-number-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0px; padding: 0 1px; }
        .day-number { font-size: 11px; font-weight: 600; color: #334155; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        
        .day-cell.is-holiday .day-number { color: #ef4444; }
        .day-cell.is-sat .day-number { color: #3b82f6; }
        .day-cell.is-today .day-number { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .day-cell.selected { background: #e0f2fe; }
        .day-cell.selected .day-number { color: #0369a1; font-weight: 800; }

        .holiday-name { font-size: 6.5px; color: #ef4444; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 1px; }
        .work-badge { font-size: 9.5px; font-weight: 700; background: #dcfce7; color: #15803d; padding: 0px; border-radius: 2px; text-align: center; width: 100%; }
        
        .pay-badge { 
            font-size: 10px; 
            font-weight: 700; 
            background: #f0fdf4; 
            color: #15803d; 
            padding: 0px; 
            border-radius: 2px; 
            text-align: center; 
            border: 1px solid #bbf7d0; 
            width: 100%; 
            white-space: nowrap; 
            letter-spacing: -0.8px; 
        }

        .memo-badge { font-size: 7.5px; font-weight: 500; background: #f1f5f9; color: #475569; padding: 0px 2px; border-radius: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid #e2e8f0; margin-top: auto; width: 100%; }

        .calendar-bottom-info { padding: 2px 12px; font-size: 11.5px; font-weight: 700; color: #0369a1; background: #ffffff; display: flex; align-items: center; gap: 6px; min-height: 22px; max-height: 22px; border-top: 1px solid #f1f5f9; flex-shrink: 0; }
        .calendar-bottom-info span { color: #334155; font-weight: 600; font-size: 11.5px; }

        .action-panel { background: #1e293b; padding: 5px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .button-group { display: grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap: 6px; align-items: center; }
        .action-btn { background: #334155; color: white; border: none; padding: 7px 0; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
        .action-btn:active { background: #475569; }
        .action-btn.primary { background: #3b82f6; }
        .action-btn.danger { background: #ef4444; }
        .action-btn.memo { background: #475569; color: #f8fafc; }
        .action-btn.site { background: #10b981; font-size: 13px; }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 310px; border: 1px solid #334155; color: white; display: flex; flex-direction: column; gap: 10px; }
        .modal-content h3 { font-size: 15px; color: #38bdf8; margin-bottom: 2px; }
        
        .modal-input-row { display: flex; gap: 8px; align-items: center; }
        .modal-input-row input { flex: 1; width: 0; padding: 8px; font-size: 15px; font-weight: bold; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; text-align: right; outline: none; }
        .modal-input-row textarea { flex: 1; width: 0; padding: 8px; font-size: 14px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; resize: none; height: 70px; outline: none; }
        .modal-input-row button { padding: 9px 14px; background: #3b82f6; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        
        .modal-checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; }
        .modal-checkbox-row input { width: 14px; height: 14px; accent-color: #3b82f6; cursor: pointer; }

        .modal-sub-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; background: #0f172a; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; }
        .modal-sub-row input { width: 110px; padding: 4px 6px; font-size: 13px; font-weight: bold; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; text-align: right; outline: none; }

        .modal-close-btn { background: #334155; color: #94a3b8; border: none; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 2px; }

        .year-nav-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; }
        .year-nav-row button { background: #1e293b; border: 1px solid #475569; color: white; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #popup-year-display { font-size: 15px; font-weight: 800; color: #38bdf8; text-align: center; flex: 1; }

        .date-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
        .date-picker-btn { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px 0; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        .date-picker-btn:active, .date-picker-btn.selected { background: #3b82f6; border-color: #3b82f6; }
    </style>
</head>
<body>

    <div class="app-header">공수 계산기</div>

    <div class="calendar-wrapper" id="calendar-wrapper">
        <div class="calendar-nav">
            <div></div>
            <span id="month-year" onclick="openDatePickerModal()">2026년 9월</span>
            <button onclick="goToToday()">오늘</button>
        </div>

        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>

        <div id="days-container" class="days-grid"></div>

        <div class="calendar-bottom-info" id="calendar-bottom-info">
            <span>현장 :</span> 선택된 날짜가 없습니다.
        </div>
    </div>

    <div class="action-panel">
        <div class="button-group">
            <button class="action-btn primary" onclick="openWorkModal()">공수</button>
            <button class="action-btn danger" onclick="openRateModal()">단가</button>
            <button class="action-btn memo" onclick="openMemoModal()">메모</button>
            <button class="action-btn site" onclick="openSiteModal()">현장</button>
        </div>
    </div>

    <div class="header-card">
        <div class="summary-row">
            <div class="summary-item">
                <label>이번 달 누적 공수</label>
                <val id="total-man-days">0.0 공수</val>
            </div>
            <div class="summary-item" style="text-align: right;">
                <label>예상 총 급여</label>
                <val class="pay" id="total-pay">0 원</val>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="date-picker-modal">
        <div class="modal-content">
            <h3>날짜 선택</h3>
            <div class="year-nav-row">
                <button onclick="changePopupYear(-1)">◀ 이전</button>
                <span id="popup-year-display">2026년</span>
                <button onclick="changePopupYear(1)">다음 ▶</button>
            </div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">월 선택</div>
            <div class="date-picker-grid" id="month-select-grid">
                <div class="date-picker-btn" onclick="selectMonthGrid(0)">1월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(1)">2월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(2)">3월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(3)">4월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(4)">5월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(5)">6월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(6)">7월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(7)">8월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(8)">9월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(9)">10월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(10)">11월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(11)">12월</div>
            </div>
            <button class="modal-close-btn" onclick="closeDatePickerModal()">취소</button>
        </div>
    </div>

    <div class="modal-overlay" id="rate-modal">
        <div class="modal-content">
            <h3>단가 설정</h3>
            <div class="modal-input-row">
                <input type="number" id="popup-rate-input" placeholder="금액 입력" step="10000">
                <button onclick="saveRate()">저장</button>
            </div>
            <div class="modal-checkbox-row">
                <input type="checkbox" id="apply-future-check">
                <label for="apply-future-check">이후 이번달 단가 모두 변경</label>
            </div>
            <div class="modal-sub-row">
                <label for="popup-bonus-input">추가수당 :</label>
                <input type="number" id="popup-bonus-input" placeholder="0" step="10000">
            </div>
            <button class="modal-close-btn" onclick="closeRateModal()">취소</button>
        </div>
    </div>

    <div class="modal-overlay" id="work-modal">
        <div class="modal-content">
            <h3>공수 설정</h3>
            <div class="modal-input-row">
                <input type="number" id="popup-work-input" placeholder="공수 (예: 1, 1.2)" step="0.1" min="0">
                <button onclick="saveWork()">저장</button>
            </div>
            <button class="modal-close-btn" onclick="closeWorkModal()">취소</button>
        </div>
    </div>

    <div class="modal-overlay" id="memo-modal">
        <div class="modal-content">
            <h3>메모 설정</h3>
            <div class="modal-input-row" style="align-items: flex-start;">
                <textarea id="popup-memo-input" placeholder="메모 내용을 입력하세요"></textarea>
                <button onclick="saveMemo()" style="height: 70px;">저장</button>
            </div>
            <button class="modal-close-btn" onclick="closeMemoModal()">취소</button>
        </div>
    </div>

    <div class="modal-overlay" id="site-modal">
        <div class="modal-content">
            <h3>현장 설정</h3>
            <div class="modal-input-row">
                <input type="text" id="popup-site-input" placeholder="현장 이름 입력" style="text-align: left; padding: 9px;">
                <button onclick="saveSite()">저장</button>
            </div>
            <button class="modal-close-btn" onclick="closeSiteModal()">취소</button>
        </div>
    </div>

<script>
    let initialWorkData = {
        "2026-07-16": 1,
        "2026-07-17": 1.3,
        "2026-07-20": 1.1,
        "2026-07-21": 1.1,
        "2026-07-22": 1,
        "2026-07-23": 1,
        "2026-07-24": 0.5
    };

    let todayObj = new Date();
    let currentDate = new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);

    let workData = JSON.parse(localStorage.getItem('workData')) || initialWorkData;
    let rateData = JSON.parse(localStorage.getItem('rateData')) || {};
    let bonusData = JSON.parse(localStorage.getItem('bonusData')) || {};
    let siteData = JSON.parse(localStorage.getItem('siteData')) || {};
    let memoData = JSON.parse(localStorage.getItem('memoData')) || {};
    
    let yToday = todayObj.getFullYear();
    let mToday = String(todayObj.getMonth() + 1).padStart(2, '0');
    let dToday = String(todayObj.getDate()).padStart(2, '0');
    let selectedDateKey = `${yToday}-${mToday}-${dToday}`;

    let tempSelectedYear = yToday;
    let tempSelectedMonth = todayObj.getMonth();

    let touchStartX = 0;
    let touchEndX = 0;

    const calendarWrapper = document.getElementById('calendar-wrapper');
    calendarWrapper.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    calendarWrapper.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        let threshold = 50;
        if (touchEndX < touchStartX - threshold) {
            changeMonth(1);
        } else if (touchEndX > touchStartX + threshold) {
            changeMonth(-1);
        }
    }

    function getSolarHolidays(year) {
        return {
            [`${year}-01-01`]: "신정", [`${year}-03-01`]: "삼일절", [`${year}-05-05`]: "어린이날",
            [`${year}-06-06`]: "현충일", [`${year}-08-15`]: "광복절", [`${year}-10-03`]: "개천절",
            [`${year}-10-09`]: "한글날", [`${year}-12-25`]: "크리스마스"
        };
    }

    function getLunarHolidays(year) {
        const lunarMap = {
            2026: { "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴", "2026-05-24": "부처님오신날", "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴" },
            2027: { "2027-02-06": "설날연휴", "2027-02-07": "설날", "2027-02-08": "설날연휴", "2027-05-13": "부처님오신날", "2027-09-14": "추석연휴", "2027-09-15": "추석", "2027-09-16": "추석연휴" },
            2028: { "2028-01-25": "설날연휴", "2028-01-26": "설날", "2028-01-27": "설날연휴", "2028-05-02": "부처님오신날", "2028-10-02": "추석연휴", "2028-10-03": "추석", "2028-10-04": "추석연휴" }
        };
        return lunarMap[year] || {};
    }

    function getRateForDate(dateKey) {
        if (rateData[dateKey] !== undefined) {
            return rateData[dateKey];
        }
        let sortedDates = Object.keys(rateData).sort();
        let applicableRate = 200000;
        for (let d of sortedDates) {
            if (d <= dateKey) {
                applicableRate = rateData[d];
            } else {
                break;
            }
        }
        return applicableRate;
    }

    function parseHoursFromManDays(val) {
        let days = Math.floor(val);
        let hours = Math.round((val - days) * 10);
        return (days * 8) + hours;
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('month-year').innerText = `${year}년 ${month + 1}월`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        const prevLastDay = new Date(year, month, 0).getDate();
        const lastDayIndex = new Date(year, month + 1, 0).getDay();
        
        let daysContainer = document.getElementById('days-container');
        daysContainer.innerHTML = '';

        for (let i = firstDayIndex; i > 0; i--) {
            daysContainer.appendChild(createDayCell(year, month - 1, prevLastDay - i + 1, true));
        }
        for (let i = 1; i <= lastDay; i++) {
            daysContainer.appendChild(createDayCell(year, month, i, false));
        }
        let nextDays = 7 - lastDayIndex - 1;
        if (nextDays < 0) nextDays += 7;
        for (let i = 1; i <= nextDays; i++) {
            daysContainer.appendChild(createDayCell(year, month + 1, i, true));
        }

        updateBottomInfo();
        calculateTotal();
    }

    function createDayCell(year, month, day, isOtherMonth) {
        let targetDate = new Date(year, month, day);
        let y = targetDate.getFullYear();
        let m = String(targetDate.getMonth() + 1).padStart(2, '0');
        let d = String(targetDate.getDate()).padStart(2, '0');
        let dateKey = `${y}-${m}-${d}`;
        let dayOfWeek = targetDate.getDay();

        let cell = document.createElement('div');
        cell.className = 'day-cell';
        if (isOtherMonth) cell.classList.add('other-month');

        let solarHolidays = getSolarHolidays(y);
        let lunarHolidays = getLunarHolidays(y);
        let holidayName = solarHolidays[dateKey] || lunarHolidays[dateKey];

        if (dayOfWeek === 0 || holidayName) {
            cell.classList.add('is-holiday');
        } else if (dayOfWeek === 6) {
            cell.classList.add('is-sat');
        }

        let today = new Date();
        if (targetDate.getFullYear() === today.getFullYear() &&
            targetDate.getMonth() === today.getMonth() &&
            targetDate.getDate() === today.getDate()) {
            cell.classList.add('is-today');
        }

        let isSelected = (selectedDateKey === dateKey);
        if (isSelected) {
            cell.classList.add('selected');
        }

        let numberArea = document.createElement('div');
        numberArea.className = 'day-number-area';
        
        let dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.innerText = day;
        numberArea.appendChild(dayNumber);
        cell.appendChild(numberArea);

        if (holidayName && !isOtherMonth) {
            let hLabel = document.createElement('div');
            hLabel.className = 'holiday-name';
            hLabel.innerText = holidayName;
            cell.appendChild(hLabel);
        }

        if (workData[dateKey] !== undefined && parseFloat(workData[dateKey]) > 0) {
            let manDays = parseFloat(workData[dateKey]);
            let badge = document.createElement('div');
            badge.className = 'work-badge';
            badge.innerText = manDays;
            cell.appendChild(badge);

            if (isSelected) {
                let rateForDay = getRateForDate(dateKey);
                let totalHours = parseHoursFromManDays(manDays);
                let hourlyRate = rateForDay / 8;
                let dayPay = Math.round(hourlyRate * totalHours) + (parseFloat(bonusData[dateKey]) || 0);

                let payBadge = document.createElement('div');
                payBadge.className = 'pay-badge';
                payBadge.innerText = dayPay.toLocaleString();
                cell.appendChild(payBadge);
            }
        }

        if (memoData[dateKey] && memoData[dateKey].trim() !== '') {
            let memoBadge = document.createElement('div');
            memoBadge.className = 'memo-badge';
            memoBadge.innerText = memoData[dateKey];
            cell.appendChild(memoBadge);
        }

        cell.onclick = function() {
            selectedDateKey = dateKey;
            renderCalendar();
        };

        return cell;
    }

    function updateBottomInfo() {
        let bottomInfo = document.getElementById('calendar-bottom-info');
        if (!selectedDateKey) {
            bottomInfo.innerHTML = `<span>현장 :</span> 선택된 날짜가 없습니다.`;
            return;
        }
        let siteVal = siteData[selectedDateKey];
        if (siteVal && siteVal.trim() !== '') {
            bottomInfo.innerHTML = `<span>현장 :</span> '${siteVal}'`;
        } else {
            bottomInfo.innerHTML = `<span>현장 :</span> (입력된 현장 없음)`;
        }
    }

    function openDatePickerModal() {
        tempSelectedYear = currentDate.getFullYear();
        tempSelectedMonth = currentDate.getMonth();
        
        updatePopupYearDisplay();
        updatePopupMonthSelection();

        document.getElementById('date-picker-modal').style.display = 'flex';
    }

    function closeDatePickerModal() {
        document.getElementById('date-picker-modal').style.display = 'none';
    }

    function changePopupYear(direction) {
        tempSelectedYear += direction;
        updatePopupYearDisplay();
    }

    function updatePopupYearDisplay() {
        document.getElementById('popup-year-display').innerText = `${tempSelectedYear}년`;
    }

    function updatePopupMonthSelection() {
        let buttons = document.querySelectorAll('#month-select-grid .date-picker-btn');
        buttons.forEach((btn, idx) => {
            if (idx === tempSelectedMonth) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });
    }

    function selectMonthGrid(monthIndex) {
        tempSelectedMonth = monthIndex;
        updatePopupMonthSelection();

        currentDate.setFullYear(tempSelectedYear);
        currentDate.setMonth(tempSelectedMonth);
        closeDatePickerModal();
        renderCalendar();
    }

    function openRateModal() {
        if (!selectedDateKey) {
            alert("날짜를 먼저 선택해 주세요!");
            return;
        }
        document.getElementById('popup-rate-input').value = rateData[selectedDateKey] !== undefined ? rateData[selectedDateKey] : getRateForDate(selectedDateKey);
        document.getElementById('popup-bonus-input').value = bonusData[selectedDateKey] !== undefined ? bonusData[selectedDateKey] : '';
        document.getElementById('apply-future-check').checked = false;
        
        let input = document.getElementById('popup-rate-input');
        document.getElementById('rate-modal').style.display = 'flex';
        input.focus();
        input.select();
    }

    function closeRateModal() {
        document.getElementById('rate-modal').style.display = 'none';
    }

    function saveRate() {
        let newRate = parseFloat(document.getElementById('popup-rate-input').value);
        let newBonus = parseFloat(document.getElementById('popup-bonus-input').value);
        let applyFutureMonth = document.getElementById('apply-future-check').checked;

        if (isNaN(newRate) || newRate < 0) {
            alert("올바른 단가 금액을 입력해주세요!");
            return;
        }

        if (applyFutureMonth) {
            let yearMonthPrefix = selectedDateKey.substring(0, 7);
            let nextMonthFirstDay = yearMonthPrefix.substring(0, 5) + String(parseInt(yearMonthPrefix.substring(5, 7)) + 1).padStart(2, '0') + "-01";
            if (yearMonthPrefix.endsWith("-12")) {
                let nextYear = parseInt(yearMonthPrefix.substring(0, 4)) + 1;
                nextMonthFirstDay = `${nextYear}-01-01`;
            }

            let keys = Object.keys(rateData);
            for (let k of keys) {
                if (k.startsWith(yearMonthPrefix) && k >= selectedDateKey) {
                    delete rateData[k];
                }
            }
            rateData[selectedDateKey] = newRate;

            let nextMonthRate = 200000;
            for (let k of keys) {
                if (k >= nextMonthFirstDay) {
                    nextMonthRate = rateData[k];
                    break;
                } else if (k < selectedDateKey) {
                    nextMonthRate = rateData[k];
                }
            }
            rateData[nextMonthFirstDay] = nextMonthRate;

        } else {
            let nextDayObj = new Date(selectedDateKey);
            nextDayObj.setDate(nextDayObj.getDate() + 1);
            let nextDayKey = nextDayObj.toISOString().split('T')[0];

            let prevBeforeRate = 200000;
            let sortedKeys = Object.keys(rateData).sort();
            for (let k of sortedKeys) {
                if (k < selectedDateKey) prevBeforeRate = rateData[k];
                else break;
            }
            let existingNextRate = rateData[nextDayKey] !== undefined ? rateData[nextDayKey] : prevBeforeRate;

            rateData[selectedDateKey] = newRate;
            rateData[nextDayKey] = existingNextRate;
        }

        if (isNaN(newBonus) || newBonus <= 0) {
            delete bonusData[selectedDateKey];
        } else {
            bonusData[selectedDateKey] = newBonus;
        }

        localStorage.setItem('rateData', JSON.stringify(rateData));
        localStorage.setItem('bonusData', JSON.stringify(bonusData));
        closeRateModal();
        renderCalendar();
    }

    function openWorkModal() {
        if (!selectedDateKey) { alert("날짜를 먼저 선택해 주세요!"); return; }
        document.getElementById('popup-work-input').value = workData[selectedDateKey] !== undefined ? workData[selectedDateKey] : '';
        
        let input = document.getElementById('popup-work-input');
        document.getElementById('work-modal').style.display = 'flex';
        input.focus();
        input.select();
    }
    function closeWorkModal() { document.getElementById('work-modal').style.display = 'none'; }
    function saveWork() {
        let val = parseFloat(document.getElementById('popup-work-input').value);
        if (isNaN(val) || val < 0) delete workData[selectedDateKey];
        else workData[selectedDateKey] = Math.round(val * 10) / 10;
        localStorage.setItem('workData', JSON.stringify(workData));
        closeWorkModal();
        renderCalendar();
    }

    function openMemoModal() {
        if (!selectedDateKey) { alert("날짜를 먼저 선택해 주세요!"); return; }
        document.getElementById('popup-memo-input').value = memoData[selectedDateKey] || '';
        
        let input = document.getElementById('popup-memo-input');
        document.getElementById('memo-modal').style.display = 'flex';
        input.focus();
        input.select();
    }
    function closeMemoModal() { document.getElementById('memo-modal').style.display = 'none'; }
    function saveMemo() {
        let val = document.getElementById('popup-memo-input').value.trim();
        if (val === '') delete memoData[selectedDateKey];
        else memoData[selectedDateKey] = val;
        localStorage.setItem('memoData', JSON.stringify(memoData));
        closeMemoModal();
        renderCalendar();
    }

    function openSiteModal() {
        if (!selectedDateKey) { alert("날짜를 먼저 선택해 주세요!"); return; }
        document.getElementById('popup-site-input').value = siteData[selectedDateKey] || '';
        
        let input = document.getElementById('popup-site-input');
        document.getElementById('site-modal').style.display = 'flex';
        input.focus();
        input.select();
    }
    function closeSiteModal() { document.getElementById('site-modal').style.display = 'none'; }
    function saveSite() {
        let val = document.getElementById('popup-site-input').value.trim();
        if (val === '') delete siteData[selectedDateKey];
        else siteData[selectedDateKey] = val;
        localStorage.setItem('siteData', JSON.stringify(siteData));
        closeSiteModal();
        renderCalendar();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function goToToday() {
        let now = new Date();
        currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
        let y = now.getFullYear();
        let m = String(now.getMonth() + 1).padStart(2, '0');
        let d = String(now.getDate()).padStart(2, '0');
        selectedDateKey = `${y}-${m}-${d}`;
        renderCalendar();
    }

    function calculateTotal() {
        let totalManDays = 0;
        let totalPay = 0;

        for (let key in workData) {
            let parts = key.split('-');
            let y = parseInt(parts[0]);
            let m = parseInt(parts[1]);

            if (y === currentDate.getFullYear() && m === (currentDate.getMonth() + 1)) {
                let manDays = parseFloat(workData[key]) || 0;
                let rateForDay = getRateForDate(key);
                let bonusForDay = parseFloat(bonusData[key]) || 0;
                
                totalManDays = Math.round((totalManDays + manDays) * 10) / 10;
                
                let totalHours = parseHoursFromManDays(manDays);
                let hourlyRate = rateForDay / 8;
                totalPay += (hourlyRate * totalHours) + bonusForDay;
            }
        }

        document.getElementById('total-man-days').innerText = totalManDays.toFixed(1) + ' 공수';
        document.getElementById('total-pay').innerText = Math.round(totalPay).toLocaleString() + ' 원';
    }

    renderCalendar();
</script>
