<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>공수계산기</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="공수계산기">
    <link rel="apple-touch-icon" href="gongsu-icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; color: #1e293b; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom); }

        /* 상단 타이틀 영역 */
        .app-header { background: #0f172a; color: white; padding: 15px 16px 12px 16px; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        .app-header .header-title { flex: 1; text-align: center; }
        .app-header .header-side { width: 24px; flex-shrink: 0; }
        .app-header .settings-btn { font-size: 18px; text-align: center; cursor: pointer; }

        /* 하단 요약 카드 */
        .header-card { background: #1e293b; color: white; padding: 6px 12px 12px 12px; border-top: 1px solid #334155; flex-shrink: 0; order: 3; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 12px; border-radius: 8px; border: 1px solid #334155; }
        .summary-item label { font-size: 15px; color: #94a3b8; display: block; }
        .summary-item val { font-size: 18px; font-weight: 700; color: #38bdf8; }
        .summary-item val.pay { color: #4ade80; }

        /* 달력 영역 */
        .calendar-wrapper { flex: 1 1 auto; background: #ffffff; display: flex; flex-direction: column; border-top-left-radius: 16px; border-top-right-radius: 16px; overflow: hidden; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); min-height: 0; order: 1; }
        
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 4px 16px; flex-shrink: 0; }
        .calendar-nav button { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; color: #334155; }
        
        #month-year { font-size: 18px; font-weight: 800; color: #0f172a; cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: background 0.2s; text-align: center; }
        #month-year:hover { background: #f1f5f9; }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; font-size: 11px; padding: 2px 2px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
        .weekdays div:first-child { color: #ef4444; } 
        .weekdays div:last-child { color: #3b82f6; }  
        .weekdays div:not(:first-child):not(:last-child) { color: #64748b; }

        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(0, 1fr); gap: 1px; padding: 2px; flex: 1; overflow: hidden; background: #e2e8f0; min-height: 0; }
        
        .day-cell { background: #f8fafc; border: none; border-radius: 2px; padding: 1px; display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer; position: relative; overflow: hidden; }
        .day-cell.other-month { opacity: 0.25; background: #fdfdfd; }
        
        .day-number-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1px; padding: 0 1px; }
        .day-number { font-size: 11px; font-weight: 600; color: #334155; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        
        .day-cell.is-holiday .day-number { color: #ef4444; }
        .day-cell.is-sat .day-number { color: #3b82f6; }
        .day-cell.is-today .day-number { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .day-cell.selected { background: #e0f2fe; }
        .day-cell.selected .day-number { color: #0369a1; font-weight: 800; }

        .holiday-name { font-size: clamp(8px, 2.3vw, 13px); color: #ef4444; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 1px; letter-spacing: -0.5px; }
        .work-badge { font-size: 10px; font-weight: 700; background: #dcfce7; color: #15803d; padding: 1px 0; border-radius: 2px; text-align: center; width: 100%; }
        .work-badge.mode-daily { background: #fef3c7; color: #b45309; }
        
        .pay-badge { 
            font-size: 11px; 
            font-weight: 700; 
            background: #f0fdf4; 
            color: #15803d; 
            padding: 1px 1px; 
            border-radius: 2px; 
            text-align: center; 
            border: 1px solid #bbf7d0; 
            width: 100%; 
            white-space: nowrap; 
            letter-spacing: -0.5px; 
        }
        .pay-badge.mode-daily { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }

        .memo-badge { font-size: 8px; font-weight: 500; background: #f1f5f9; color: #475569; padding: 1px 2px; border-radius: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid #e2e8f0; margin-top: auto; width: 100%; }

        .calendar-bottom-info { padding: 4px 12px; font-size: 15px; font-weight: 700; color: #0369a1; background: #ffffff; display: flex; align-items: center; justify-content: space-between; min-height: 24px; max-height: 24px; border-top: 1px solid #f1f5f9; flex-shrink: 0; }
        .calendar-bottom-info span { color: #334155; font-weight: 600; font-size: 15px; }
        
        /* 금액 체크박스 스타일 */
        .show-pay-label { font-size: 12px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .show-pay-label input { width: 13px; height: 13px; accent-color: #3b82f6; cursor: pointer; }

        /* 액션 버튼 패널 */
        .action-panel { background: #1e293b; padding: 8px 12px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; order: 2; }
        .button-group { display: grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap: 6px; align-items: center; }
        .action-btn { background: #334155; color: white; border: none; padding: 9px 0; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
        .action-btn:active { background: #475569; }
        .action-btn.primary { background: #3b82f6; }
        .action-btn.danger { background: #ef4444; }
        .action-btn.memo { background: #475569; color: #f8fafc; }
        .action-btn.site { background: #10b981; font-size: 13px; }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: min(310px, 90vw); border: 1px solid #334155; color: white; display: flex; flex-direction: column; gap: 10px; }
        .modal-content h3 { font-size: 15px; color: #38bdf8; margin-bottom: 2px; }
        
        .modal-input-row { display: flex; gap: 8px; align-items: center; }
        .modal-input-row input { width: 100%; padding: 10px; font-size: 16px; font-weight: bold; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; text-align: right; outline: none; }
        .modal-input-row textarea { width: 100%; padding: 10px; font-size: 14px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; resize: none; height: 80px; outline: none; text-align: left; }
        
        .modal-checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; }
        .modal-checkbox-row input { width: 14px; height: 14px; accent-color: #3b82f6; cursor: pointer; }

        .modal-sub-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; background: #0f172a; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; }
        .modal-sub-row input { width: 110px; padding: 4px 6px; font-size: 13px; font-weight: bold; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; text-align: right; outline: none; }

        .modal-save-btn { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 2px; width: 100%; }
        .modal-save-btn:active { background: #2563eb; }

        .year-nav-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; }
        .year-nav-row button { background: #1e293b; border: 1px solid #475569; color: white; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #popup-year-display { font-size: 15px; font-weight: 800; color: #38bdf8; text-align: center; flex: 1; }

        .date-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
        .date-picker-btn { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px 0; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        .date-picker-btn:active, .date-picker-btn.selected { background: #3b82f6; border-color: #3b82f6; }

        .mode-select-btn { padding: 10px 0; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; border: 1px solid transparent; }
        .mode-select-btn.hourly { background: #dcfce7; color: #15803d; }
        .mode-select-btn.hourly.selected { background: #15803d; color: white; border-color: #15803d; }
        .mode-select-btn.daily { background: #fef3c7; color: #b45309; }
        .mode-select-btn.daily.selected { background: #b45309; color: white; border-color: #b45309; }
    </style>
</head>
<body>

    <div class="app-header">
        <span class="header-side"></span>
        <span class="header-title">공수 계산기</span>
        <span class="header-side settings-btn" onclick="openSettingsModal()">⚙️</span>
    </div>

    <div class="calendar-wrapper" id="calendar-wrapper">
        <div class="calendar-nav">
            <div></div>
            <span id="month-year" onclick="openDatePickerModal()">2026년 9월</span>
            <button onclick="goToToday()">오늘</button>
        </div>

        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>

        <div id="days-container" class="days-grid"></div>

        <div class="calendar-bottom-info" id="calendar-bottom-info">
            <div id="site-display-area"><span>현장 :</span> 선택된 월이 없습니다.</div>
            <label class="show-pay-label">
                <input type="checkbox" id="show-pay-checkbox" onchange="toggleShowPay()"> 금액
            </label>
        </div>
    </div>

    <div class="action-panel">
        <div class="button-group">
            <button class="action-btn primary" onclick="openWorkModal()">공수</button>
            <button class="action-btn danger" onclick="openRateModal()">단가</button>
            <button class="action-btn memo" onclick="openMemoModal()">메모</button>
            <button class="action-btn site" onclick="openSiteModal()">현장</button>
        </div>
    </div>

    <div class="header-card">
        <div class="summary-row">
            <div class="summary-item">
                <label>이번 달 누적 공수</label>
                <val id="total-man-days">0.0 공수</val>
            </div>
            <div class="summary-item" style="text-align: right;">
                <label>예상 총 급여</label>
                <val class="pay" id="total-pay">0 원</val>
            </div>
        </div>
    </div>

    <!-- 모달들 -->
    <div class="modal-overlay" id="date-picker-modal" onclick="handleModalOutsideClick(event, 'date-picker-modal')">
        <div class="modal-content">
            <h3>날짜 선택</h3>
            <div class="year-nav-row">
                <button onclick="changePopupYear(-1)">◀ 이전</button>
                <span id="popup-year-display">2026년</span>
                <button onclick="changePopupYear(1)">다음 ▶</button>
            </div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">월 선택</div>
            <div class="date-picker-grid" id="month-select-grid">
                <div class="date-picker-btn" onclick="selectMonthGrid(0)">1월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(1)">2월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(2)">3월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(3)">4월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(4)">5월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(5)">6월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(6)">7월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(7)">8월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(8)">9월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(9)">10월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(10)">11월</div>
                <div class="date-picker-btn" onclick="selectMonthGrid(11)">12월</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="rate-modal" onclick="handleModalOutsideClick(event, 'rate-modal')">
        <div class="modal-content">
            <h3>단가 설정</h3>
            <div class="modal-input-row">
                <input type="number" id="popup-rate-input" placeholder="금액 입력" step="10000">
            </div>
            <div class="modal-checkbox-row">
                <input type="checkbox" id="apply-future-check">
                <label for="apply-future-check">이후 이번달 단가 모두 변경</label>
            </div>
            <div class="modal-sub-row">
                <label for="popup-bonus-input">추가수당 :</label>
                <input type="number" id="popup-bonus-input" placeholder="0" step="10000">
            </div>
            <button class="modal-save-btn" onclick="saveRate()">저장</button>
        </div>
    </div>

    <div class="modal-overlay" id="work-modal" onclick="handleModalOutsideClick(event, 'work-modal')">
        <div class="modal-content">
            <h3>공수 설정</h3>
            <div class="modal-input-row">
                <input type="number" id="popup-work-input" placeholder="공수 (예: 1, 1.2)" step="0.1" min="0">
            </div>
            <button class="modal-save-btn" onclick="saveWork()">저장</button>
        </div>
    </div>

    <div class="modal-overlay" id="memo-modal" onclick="handleModalOutsideClick(event, 'memo-modal')">
        <div class="modal-content">
            <h3>메모 설정</h3>
            <div class="modal-input-row">
                <textarea id="popup-memo-input" placeholder="메모 내용을 입력하세요"></textarea>
            </div>
            <button class="modal-save-btn" onclick="saveMemo()">저장</button>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal" onclick="handleModalOutsideClick(event, 'settings-modal')">
        <div class="modal-content">
            <h3>계산 방식 설정</h3>
            <div style="font-size: 12px; color: #94a3b8;">지금부터 입력하는 날짜에 적용될 방식을 선택하세요. (이미 저장된 날짜는 바뀌지 않아요)</div>
            <div class="date-picker-grid" style="grid-template-columns: repeat(2, 1fr);">
                <div class="mode-select-btn hourly" id="mode-btn-hourly" onclick="selectMode('hourly')">시급</div>
                <div class="mode-select-btn daily" id="mode-btn-daily" onclick="selectMode('daily')">일당</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="site-modal" onclick="handleModalOutsideClick(event, 'site-modal')">
        <div class="modal-content">
            <h3>현장 설정</h3>
            <div class="modal-input-row">
                <input type="text" id="popup-site-input" placeholder="현장 이름 입력" style="text-align: left; padding: 10px;">
            </div>
            <button class="modal-save-btn" onclick="saveSite()">저장</button>
        </div>
    </div>

<!-- 음력↔양력 변환: 한국천문연구원(KASI) 데이터 기반, MIT 라이선스, 오프라인 동작 -->
<script src="https://cdn.jsdelivr.net/npm/kor-lunar@1.7/dist/kor-lunar.min.js"></script>

<script>
    localStorage.removeItem('extraHolidayCache');
    let initialWorkData = {};

    let todayObj = new Date();
    let currentDate = new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);

    let workData = JSON.parse(localStorage.getItem('workData')) || initialWorkData;
    let rateData = JSON.parse(localStorage.getItem('rateData')) || {};
    let bonusData = JSON.parse(localStorage.getItem('bonusData')) || {};
    let siteData = JSON.parse(localStorage.getItem('siteData')) || {};
    let memoData = JSON.parse(localStorage.getItem('memoData')) || {};
    let modeData = JSON.parse(localStorage.getItem('modeData')) || {};
    let currentMode = localStorage.getItem('currentMode') || 'hourly';
    
    // 금액 체크박스 설정 불러오기 (기본값 false: 체크 안 됨)
    let showPay = JSON.parse(localStorage.getItem('showPay')) || false;
    document.getElementById('show-pay-checkbox').checked = showPay;

    let yToday = todayObj.getFullYear();
    let mToday = String(todayObj.getMonth() + 1).padStart(2, '0');
    let dToday = String(todayObj.getDate()).padStart(2, '0');
    let selectedDateKey = `${yToday}-${mToday}-${dToday}`;

    let tempSelectedYear = yToday;
    let tempSelectedMonth = todayObj.getMonth();

    let touchStartX = 0;
    let touchEndX = 0;

    const calendarWrapper = document.getElementById('calendar-wrapper');
    calendarWrapper.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    calendarWrapper.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        let threshold = 50;
        if (touchEndX < touchStartX - threshold) {
            changeMonth(1);
        } else if (touchEndX > touchStartX + threshold) {
            changeMonth(-1);
        }
    }

    function handleModalOutsideClick(event, modalId) {
        if (event.target.id === modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    }

    // === ① 고정 날짜 공휴일 ===
    // 법으로 날짜가 못박혀 있어 매년 동일 → 하드코딩이 정답.
    // 2026-07-17부터 제헌절이 18년 만에 공휴일로 재지정됨(2026.5.11 시행) → 2026년부터 포함.
    function getSolarHolidays(year) {
        let holidays = {
            [`${year}-01-01`]: "신정", [`${year}-03-01`]: "삼일절", [`${year}-05-05`]: "어린이날",
            [`${year}-06-06`]: "현충일", [`${year}-08-15`]: "광복절", [`${year}-10-03`]: "개천절",
            [`${year}-10-09`]: "한글날", [`${year}-12-25`]: "크리스마스"
        };
        if (year >= 2026) {
            holidays[`${year}-07-17`] = "제헌절";
        }
        return holidays;
    }

    // === ② 명절(설날/추석/부처님오신날) ===
    // 음력→양력 변환은 kor-lunar 라이브러리(KASI 데이터 기반, 1890~2050 지원)로 계산.
    // 설날(음1/1)·추석(음8/15)의 "연휴"는 하루 전날과 다음날을 포함.
    function getLunarHolidays(year) {
        let result = {};
        function put(dateObj, name) {
            let y = dateObj.getFullYear();
            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let d = String(dateObj.getDate()).padStart(2, '0');
            result[`${y}-${m}-${d}`] = name;
        }
        try {
            let seollal = window.korLunar.toSolar(year, 1, 1);
            let seollalDate = new Date(seollal.year, seollal.month - 1, seollal.day);
            let prev = new Date(seollalDate); prev.setDate(seollalDate.getDate() - 1);
            let next = new Date(seollalDate); next.setDate(seollalDate.getDate() + 1);
            put(prev, "설날연휴"); put(seollalDate, "설날"); put(next, "설날연휴");

            let chuseok = window.korLunar.toSolar(year, 8, 15);
            let chuseokDate = new Date(chuseok.year, chuseok.month - 1, chuseok.day);
            let cPrev = new Date(chuseokDate); cPrev.setDate(chuseokDate.getDate() - 1);
            let cNext = new Date(chuseokDate); cNext.setDate(chuseokDate.getDate() + 1);
            put(cPrev, "추석연휴"); put(chuseokDate, "추석"); put(cNext, "추석연휴");

            let buddha = window.korLunar.toSolar(year, 4, 8);
            put(new Date(buddha.year, buddha.month - 1, buddha.day), "부처님오신날");
        } catch (e) {
            // 라이브러리 로드 실패 또는 지원 범위(1890~2050) 밖인 경우 조용히 무시
            console.warn('음력 변환 실패:', e);
        }
        return result;
    }

    function formatDateKey(dateObj) {
        let y = dateObj.getFullYear();
        let m = String(dateObj.getMonth() + 1).padStart(2, '0');
        let d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // === ③ 대체공휴일 ===
    // 관공서의 공휴일에 관한 규정에 따라 직접 계산 (외부 API 불필요).
    // 대상: 신정·현충일만 제외, 나머지 전부 대상 (2023.5월부터 부처님오신날·크리스마스도 포함).
    // 요일 조건: 설날/추석연휴 그룹은 "일요일"과 겹칠 때만 대체, 그 외는 "토/일요일" 모두 대체.
    const SUNDAY_ONLY_NAMES = ["설날연휴", "설날", "추석연휴", "추석"];
    const NO_SUBSTITUTE_NAMES = ["신정", "현충일"];

    function calcSubstituteHolidays(year, solar, lunar, extra) {
        let base = { ...solar, ...lunar };
        let occupied = new Set([...Object.keys(base), ...Object.keys(extra)]);
        let substitutes = {};

        Object.keys(base).sort().forEach(dateKey => {
            let name = base[dateKey];
            if (NO_SUBSTITUTE_NAMES.includes(name)) return;

            let [y, m, d] = dateKey.split('-').map(Number);
            let dateObj = new Date(y, m - 1, d);
            let dow = dateObj.getDay(); // 0=일, 6=토

            let needsSubstitute = SUNDAY_ONLY_NAMES.includes(name) ? (dow === 0) : (dow === 0 || dow === 6);
            if (!needsSubstitute) return;

            let candidate = new Date(dateObj);
            do {
                candidate.setDate(candidate.getDate() + 1);
            } while (
                candidate.getDay() === 0 || candidate.getDay() === 6 ||
                occupied.has(formatDateKey(candidate))
            );

            let key = formatDateKey(candidate);
            substitutes[key] = "대체공휴일";
            occupied.add(key);
        });

        return substitutes;
    }

    // === 정기 선거일 ===
    // 임기가 고정 주기인 선거는 공직선거법의 계산식으로 정확히 계산 가능 (법 조문 기준 검증 완료):
    // - 국회의원 총선거: 임기만료일(5/29) 전 50일 이후 첫 번째 수요일 → 4년 주기 (2024.4.10, 2028.4.12로 검증)
    // - 전국동시지방선거: 임기만료일(6/30) 전 30일 이후 첫 번째 수요일 → 4년 주기 (2022.6.1, 2026.6.3으로 검증)
    // ※ 대통령선거는 2025년 조기대선(탄핵)으로 임기 주기가 리셋되어, 차기 정기 대선일이
    //   아직 공식 확정 전까지는 불확실성이 있음 → 정기 계산 대신 아래 JSON(임시공휴일/선거일)에서 관리.
    function firstWednesdayOnOrAfter(year, month, day) {
        let d = new Date(year, month - 1, day);
        while (d.getDay() !== 3) { // 0=일요일 ... 3=수요일
            d.setDate(d.getDate() + 1);
        }
        return d;
    }

    function getRegularElectionHolidays(year) {
        let result = {};
        if ((year - 2024) % 4 === 0) {
            result[formatDateKey(firstWednesdayOnOrAfter(year, 4, 9))] = "국회의원선거일";
        }
        if ((year - 2022) % 4 === 0) {
            result[formatDateKey(firstWednesdayOnOrAfter(year, 5, 31))] = "전국동시지방선거일";
        }
        return result;
    }

    // === 임시공휴일 / 선거일(쉬는날) — 계산 불가능한 값만 GitHub JSON으로 오버레이 ===
    // 이 둘은 예측 불가능해서 API/키 없이는 알 수 없음. 대신 공개 정적 JSON 파일을 fetch.
    // (정기 국회의원선거/지방선거는 위에서 공식으로 이미 계산되므로 여기 넣을 필요 없음)
    // 형식 예: { "2026-08-14": "임시공휴일", "2030-03-06": "대통령선거일" }
    // TODO: 실제 GitHub 저장소를 만든 뒤 아래 주소를 raw 파일 주소로 교체하세요.
    const HOLIDAYS_EXTRA_URL = "https://raw.githubusercontent.com/eunsoonism/Gongsu-Calculator/refs/heads/main/holidays-extra.json";
    let extraHolidayCache = JSON.parse(localStorage.getItem('extraHolidayCache')) || {};
    let extraHolidayFetching = false;
    const EXTRA_HOLIDAY_MAX_AGE = 1000 * 60 * 60 * 24; // 하루 1회만 재확인

    function ensureExtraHolidaysFresh() {
        let isStale = !extraHolidayCache.fetchedAt || (Date.now() - extraHolidayCache.fetchedAt) > EXTRA_HOLIDAY_MAX_AGE;
        if (!isStale || extraHolidayFetching) return;

        extraHolidayFetching = true;
        fetch(HOLIDAYS_EXTRA_URL)
            .then(res => {
                if (!res.ok) throw new Error('임시공휴일 JSON 응답 오류');
                return res.json();
            })
            .then(data => {
                extraHolidayCache = { data: data, fetchedAt: Date.now() };
                localStorage.setItem('extraHolidayCache', JSON.stringify(extraHolidayCache));
                renderCalendar();
            })
            .catch(() => {
                // 실패 시 조용히 무시 (캐시된 값 또는 빈 값 유지)
            })
            .finally(() => {
                extraHolidayFetching = false;
            });
    }

    function getExtraHolidaysForYear(year) {
        let data = (extraHolidayCache && extraHolidayCache.data) ? extraHolidayCache.data : {};
        let filtered = {};
        Object.keys(data).forEach(key => {
            if (key.startsWith(`${year}-`)) filtered[key] = data[key];
        });
        return filtered;
    }

    function getHolidaysForYear(year) {
        let solar = getSolarHolidays(year);
        let lunar = getLunarHolidays(year);
        let elections = getRegularElectionHolidays(year);
        let extra = getExtraHolidaysForYear(year);
        let substitutes = calcSubstituteHolidays(year, solar, lunar, { ...elections, ...extra });
        return { ...solar, ...lunar, ...elections, ...extra, ...substitutes };
    }

    function openSettingsModal() {
        updateSettingsModalUI();
        document.getElementById('settings-modal').style.display = 'flex';
    }

    function updateSettingsModalUI() {
        document.getElementById('mode-btn-hourly').classList.toggle('selected', currentMode === 'hourly');
        document.getElementById('mode-btn-daily').classList.toggle('selected', currentMode === 'daily');
    }

    function selectMode(mode) {
        currentMode = mode;
        localStorage.setItem('currentMode', currentMode);
        updateSettingsModalUI();
        document.getElementById('settings-modal').style.display = 'none';
    }

    function getModeForDate(dateKey) {
        return modeData[dateKey] || 'hourly';
    }

    function getRateForDate(dateKey) {
        if (rateData[dateKey] !== undefined) {
            return rateData[dateKey];
        }
        let sortedDates = Object.keys(rateData).sort();
        let applicableRate = 200000;
        for (let d of sortedDates) {
            if (d <= dateKey) {
                applicableRate = rateData[d];
            } else {
                break;
            }
        }
        return applicableRate;
    }

    function parseHoursFromManDays(val) {
        let days = Math.floor(val);
        let hours = Math.round((val - days) * 10);
        return (days * 8) + hours;
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('month-year').innerText = `${year}년 ${month + 1}월`;

        ensureExtraHolidaysFresh();

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        const prevLastDay = new Date(year, month, 0).getDate();
        const lastDayIndex = new Date(year, month + 1, 0).getDay();
        
        let daysContainer = document.getElementById('days-container');
        daysContainer.innerHTML = '';

        for (let i = firstDayIndex; i > 0; i--) {
            daysContainer.appendChild(createDayCell(year, month - 1, prevLastDay - i + 1, true));
        }
        for (let i = 1; i <= lastDay; i++) {
            daysContainer.appendChild(createDayCell(year, month, i, false));
        }
        let nextDays = 7 - lastDayIndex - 1;
        if (nextDays < 0) nextDays += 7;
        for (let i = 1; i <= nextDays; i++) {
            daysContainer.appendChild(createDayCell(year, month + 1, i, true));
        }

        updateBottomInfo();
        calculateTotal();
    }

    function createDayCell(year, month, day, isOtherMonth) {
        let targetDate = new Date(year, month, day);
        let y = targetDate.getFullYear();
        let m = String(targetDate.getMonth() + 1).padStart(2, '0');
        let d = String(targetDate.getDate()).padStart(2, '0');
        let dateKey = `${y}-${m}-${d}`;
        let dayOfWeek = targetDate.getDay();

        let cell = document.createElement('div');
        cell.className = 'day-cell';
        if (isOtherMonth) cell.classList.add('other-month');

        let holidaysOfYear = getHolidaysForYear(y);
        let holidayName = holidaysOfYear[dateKey];

        if (dayOfWeek === 0 || holidayName) {
            cell.classList.add('is-holiday');
        } else if (dayOfWeek === 6) {
            cell.classList.add('is-sat');
        }

        let today = new Date();
        if (targetDate.getFullYear() === today.getFullYear() &&
            targetDate.getMonth() === today.getMonth() &&
            targetDate.getDate() === today.getDate()) {
            cell.classList.add('is-today');
        }

        let isSelected = (selectedDateKey === dateKey);
        if (isSelected) {
            cell.classList.add('selected');
        }

        let numberArea = document.createElement('div');
        numberArea.className = 'day-number-area';
        
        let dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.innerText = day;
        numberArea.appendChild(dayNumber);
        cell.appendChild(numberArea);

        if (holidayName && !isOtherMonth) {
            let hLabel = document.createElement('div');
            hLabel.className = 'holiday-name';
            hLabel.innerText = holidayName;
            cell.appendChild(hLabel);
        }

        if (workData[dateKey] !== undefined && parseFloat(workData[dateKey]) > 0) {
            let manDays = parseFloat(workData[dateKey]);
            let badge = document.createElement('div');
            badge.className = getModeForDate(dateKey) === 'daily' ? 'work-badge mode-daily' : 'work-badge';
            badge.innerText = manDays;
            cell.appendChild(badge);

            // '금액' 체크박스가 켜져 있을 때만 날짜칸에 금액 표시
            if (showPay) {
                let rateForDay = getRateForDate(dateKey);
                let bonusForDay = parseFloat(bonusData[dateKey]) || 0;
                let dayPay;
                if (getModeForDate(dateKey) === 'daily') {
                    dayPay = Math.round(rateForDay * manDays) + bonusForDay;
                } else {
                    let totalHours = parseHoursFromManDays(manDays);
                    let hourlyRate = rateForDay / 8;
                    dayPay = Math.round(hourlyRate * totalHours) + bonusForDay;
                }

                let payBadge = document.createElement('div');
                payBadge.className = getModeForDate(dateKey) === 'daily' ? 'pay-badge mode-daily' : 'pay-badge';
                payBadge.innerText = dayPay.toLocaleString();
                cell.appendChild(payBadge);
            }
        }

        if (memoData[dateKey] && memoData[dateKey].trim() !== '') {
            let memoBadge = document.createElement('div');
            memoBadge.className = 'memo-badge';
            memoBadge.innerText = memoData[dateKey];
            cell.appendChild(memoBadge);
        }

        cell.onclick = function() {
            selectedDateKey = dateKey;
            renderCalendar();
        };

        return cell;
    }

    function updateBottomInfo() {
        let siteDisplayArea = document.getElementById('site-display-area');
        let y = currentDate.getFullYear();
        let m = String(currentDate.getMonth() + 1).padStart(2, '0');
        let monthKey = `${y}-${m}`;

        let siteVal = siteData[monthKey];
        if (siteVal && siteVal.trim() !== '') {
            siteDisplayArea.innerHTML = `<span>현장 :</span> '${siteVal}'`;
        } else {
            siteDisplayArea.innerHTML = `<span>현장 :</span> (입력된 현장 없음)`;
        }
    }

    // 금액 체크박스 토글 함수
    function toggleShowPay() {
        showPay = document.getElementById('show-pay-checkbox').checked;
        localStorage.setItem('showPay', JSON.stringify(showPay));
        renderCalendar();
    }

    function openDatePickerModal() {
        tempSelectedYear = currentDate.getFullYear();
        tempSelectedMonth = currentDate.getMonth();
        
        updatePopupYearDisplay();
        updatePopupMonthSelection();

        document.getElementById('date-picker-modal').style.display = 'flex';
    }

    function changePopupYear(direction) {
        tempSelectedYear += direction;
        updatePopupYearDisplay();
    }

    function updatePopupYearDisplay() {
        document.getElementById('popup-year-display').innerText = `${tempSelectedYear}년`;
    }

    function updatePopupMonthSelection() {
        let buttons = document.querySelectorAll('#month-select-grid .date-picker-btn');
        buttons.forEach((btn, idx) => {
            if (idx === tempSelectedMonth) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });
    }

    function selectMonthGrid(monthIndex) {
        tempSelectedMonth = monthIndex;
        updatePopupMonthSelection();

        currentDate.setFullYear(tempSelectedYear);
        currentDate.setMonth(tempSelectedMonth);
        document.getElementById('date-picker-modal').style.display = 'none';
        renderCalendar();
    }

    function openRateModal() {
        if (!selectedDateKey) {
            alert("날짜를 먼저 선택해 주세요!");
            return;
        }
        document.getElementById('popup-rate-input').value = rateData[selectedDateKey] !== undefined ? rateData[selectedDateKey] : getRateForDate(selectedDateKey);
        document.getElementById('popup-bonus-input').value = bonusData[selectedDateKey] !== undefined ? bonusData[selectedDateKey] : '';
        document.getElementById('apply-future-check').checked = false;
        
        let input = document.getElementById('popup-rate-input');
        document.getElementById('rate-modal').style.display = 'flex';
        input.focus();
        input.select();
    }

    function saveRate() {
        let newRate = parseFloat(document.getElementById('popup-rate-input').value);
        let newBonus = parseFloat(document.getElementById('popup-bonus-input').value);
        let applyFutureMonth = document.getElementById('apply-future-check').checked;

        if (isNaN(newRate) || newRate < 0) {
            alert("올바른 단가 금액을 입력해주세요!");
            return;
        }

        if (applyFutureMonth) {
            let yearMonthPrefix = selectedDateKey.substring(0, 7);
            let nextMonthFirstDay = yearMonthPrefix.substring(0, 5) + String(parseInt(yearMonthPrefix.substring(5, 7)) + 1).padStart(2, '0') + "-01";
            if (yearMonthPrefix.endsWith("-12")) {
                let nextYear = parseInt(yearMonthPrefix.substring(0, 4)) + 1;
                nextMonthFirstDay = `${nextYear}-01-01`;
            }

            let keys = Object.keys(rateData);
            for (let k of keys) {
                if (k.startsWith(yearMonthPrefix) && k >= selectedDateKey) {
                    delete rateData[k];
                }
            }
            rateData[selectedDateKey] = newRate;

            let nextMonthRate = 200000;
            for (let k of keys) {
                if (k >= nextMonthFirstDay) {
                    nextMonthRate = rateData[k];
                    break;
                } else if (k < selectedDateKey) {
                    nextMonthRate = rateData[k];
                }
            }
            rateData[nextMonthFirstDay] = nextMonthRate;

        } else {
            let nextDayObj = new Date(selectedDateKey);
            nextDayObj.setDate(nextDayObj.getDate() + 1);
            let nextDayKey = nextDayObj.toISOString().split('T')[0];

            let prevBeforeRate = 200000;
            let sortedKeys = Object.keys(rateData).sort();
            for (let k of sortedKeys) {
                if (k < selectedDateKey) prevBeforeRate = rateData[k];
                else break;
            }
            let existingNextRate = rateData[nextDayKey] !== undefined ? rateData[nextDayKey] : prevBeforeRate;

            rateData[selectedDateKey] = newRate;
            rateData[nextDayKey] = existingNextRate;
        }

        if (isNaN(newBonus) || newBonus <= 0) {
            delete bonusData[selectedDateKey];
        } else {
            bonusData[selectedDateKey] = newBonus;
        }

        modeData[selectedDateKey] = currentMode;
        localStorage.setItem('modeData', JSON.stringify(modeData));
        localStorage.setItem('rateData', JSON.stringify(rateData));
        localStorage.setItem('bonusData', JSON.stringify(bonusData));
        document.getElementById('rate-modal').style.display = 'none';
        renderCalendar();
    }

    function openWorkModal() {
        if (!selectedDateKey) { alert("날짜를 먼저 선택해 주세요!"); return; }
        
        let existingVal = parseFloat(workData[selectedDateKey]);
        // 값이 없거나 0 이하이면 무조건 1로 설정
        let val = (!isNaN(existingVal) && existingVal > 0) ? existingVal : 1;
        
        document.getElementById('popup-work-input').value = val;
        
        let input = document.getElementById('popup-work-input');
        document.getElementById('work-modal').style.display = 'flex';
        input.focus();
        input.select();
    }
    
    function saveWork() {
        let val = parseFloat(document.getElementById('popup-work-input').value);
        if (isNaN(val) || val < 0) {
            delete workData[selectedDateKey];
        } else {
            workData[selectedDateKey] = Math.round(val * 10) / 10;
            modeData[selectedDateKey] = currentMode;
            localStorage.setItem('modeData', JSON.stringify(modeData));
        }
        localStorage.setItem('workData', JSON.stringify(workData));
        document.getElementById('work-modal').style.display = 'none';
        renderCalendar();
    }

    function openMemoModal() {
        if (!selectedDateKey) { alert("날짜를 먼저 선택해 주세요!"); return; }
        document.getElementById('popup-memo-input').value = memoData[selectedDateKey] || '';
        
        let input = document.getElementById('popup-memo-input');
        document.getElementById('memo-modal').style.display = 'flex';
        input.focus();
        input.select();
    }
    
    function saveMemo() {
        let val = document.getElementById('popup-memo-input').value.trim();
        if (val === '') delete memoData[selectedDateKey];
        else memoData[selectedDateKey] = val;
        localStorage.setItem('memoData', JSON.stringify(memoData));
        document.getElementById('memo-modal').style.display = 'none';
        renderCalendar();
    }

    function openSiteModal() {
        let y = currentDate.getFullYear();
        let m = String(currentDate.getMonth() + 1).padStart(2, '0');
        let monthKey = `${y}-${m}`;

        document.getElementById('popup-site-input').value = siteData[monthKey] || '';
        
        let input = document.getElementById('popup-site-input');
        document.getElementById('site-modal').style.display = 'flex';
        input.focus();
        input.select();
    }
    
    function saveSite() {
        let y = currentDate.getFullYear();
        let m = String(currentDate.getMonth() + 1).padStart(2, '0');
        let monthKey = `${y}-${m}`;

        let val = document.getElementById('popup-site-input').value.trim();
        if (val === '') {
            delete siteData[monthKey];
        } else {
            siteData[monthKey] = val;
        }
        localStorage.setItem('siteData', JSON.stringify(siteData));
        document.getElementById('site-modal').style.display = 'none';
        renderCalendar();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function goToToday() {
        let now = new Date();
        currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
        let y = now.getFullYear();
        let m = String(now.getMonth() + 1).padStart(2, '0');
        let d = String(now.getDate()).padStart(2, '0');
        selectedDateKey = `${y}-${m}-${d}`;
        renderCalendar();
    }

    function calculateTotal() {
        let totalManDays = 0;
        let totalPay = 0;

        for (let key in workData) {
            let parts = key.split('-');
            let y = parseInt(parts[0]);
            let m = parseInt(parts[1]);

            if (y === currentDate.getFullYear() && m === (currentDate.getMonth() + 1)) {
                let manDays = parseFloat(workData[key]) || 0;
                let rateForDay = getRateForDate(key);
                let bonusForDay = parseFloat(bonusData[key]) || 0;
                
                totalManDays = Math.round((totalManDays + manDays) * 10) / 10;

                if (getModeForDate(key) === 'daily') {
                    totalPay += (rateForDay * manDays) + bonusForDay;
                } else {
                    let totalHours = parseHoursFromManDays(manDays);
                    let hourlyRate = rateForDay / 8;
                    totalPay += (hourlyRate * totalHours) + bonusForDay;
                }
            }
        }

        document.getElementById('total-man-days').innerText = totalManDays.toFixed(1) + ' 공수';
        document.getElementById('total-pay').innerText = Math.round(totalPay).toLocaleString() + ' 원';
    }

    renderCalendar();
</script>
